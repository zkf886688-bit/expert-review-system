spring:
  datasource:
    url: jdbc:mysql://mysql:3306/expert_review?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root}
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  jwt:
    secret: ${JWT_SECRET:DockerDevSecretKeyChangeInProduction2026LongEnough}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://127.0.0.1}
  error:
    expose-details: false
  upload:
    dir: /app/uploads
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@review.local}
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:mock}
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    tencent:
      secret-id: ${TENCENT_SMS_SECRET_ID:}
      secret-key: ${TENCENT_SMS_SECRET_KEY:}
      sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
      sign-name: ${TENCENT_SMS_SIGN_NAME:}
      template-id: ${TENCENT_SMS_TEMPLATE_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    mail:
      enabled: false
    redis:
      enabled: ${app.captcha.redis-enabled:false}
    diskspace:
      path: ${app.upload.dir:/app/uploads}
      threshold: 100MB

info:
  app:
    phase: 19
